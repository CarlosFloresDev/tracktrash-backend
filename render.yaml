# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: tracktrash-api
    runtime: docker
    plan: free
    region: virginia
    repo: https://github.com/CarlosFloresDev/tracktrash-backend
    branch: feat/ecosistema-tracktrash
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: off
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: '8080'
      - key: ASPNETCORE_HTTP_PORTS
        value: '8080'
      - key: Authentication__Demo
        value: 'false'
      - key: Authentication__Authority
        value: https://owfjolparskdiazhfubr.supabase.co/auth/v1
      - key: ConnectionStrings__TrackTrash
        sync: false
      - key: Cors__Origins__0
        value: https://tracktrash.pages.dev
      - key: Jobs__Enabled
        value: 'true'
